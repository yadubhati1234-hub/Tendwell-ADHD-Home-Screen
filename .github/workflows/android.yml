name: Android build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # To push the screenshots to a shots/ branch.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The upload key lives in repository secrets. Without it (for example on
      # a fork), the release bundle is still built, just unsigned.
      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.TENDWELL_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "TENDWELL_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release bundle will be signed with the upload key."
          else
            echo "::notice::No upload key secret, so the release bundle is unsigned."
          fi

      - name: Lint, unit tests and builds
        env:
          VERSION_CODE: ${{ github.run_number }}
          TENDWELL_KEYSTORE_PASSWORD: ${{ secrets.TENDWELL_KEYSTORE_PASSWORD }}
          TENDWELL_KEY_ALIAS: ${{ secrets.TENDWELL_KEY_ALIAS }}
          TENDWELL_KEY_PASSWORD: ${{ secrets.TENDWELL_KEY_PASSWORD }}
        run: ./gradlew --stacktrace lintDebug testDebugUnitTest assembleDebug bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tendwell-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: tendwell-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7

      # The screenshot tests (app/src/test/.../screenshots) draw every screen on
      # phone and tablet, light and dark. They go to the branch
      # shots/jvm-<branch> so they can be viewed without downloading artifacts.
      - name: Push screen screenshots
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/push-screenshots.sh app/build/outputs/roborazzi jvm

  # Installs the debug build on an emulator and walks a fresh install through
  # every main screen (app/src/androidTest/.../SmokeTest.kt). A crash fails it.
  # Its step-by-step screenshots go to the branch shots/emulator-<branch>.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and the test
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # Each script line runs on its own. A failed test is recorded and the job
      # fails at the end, after the screenshots and logcat are saved.
      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # A just-booted emulator's own apps can raise "isn't responding" dialogs
          # that take window focus from the test, so they are hidden first.
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            ./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch smoke-failed
            mkdir -p emulator-shots
            adb pull /sdcard/Android/data/app.tendwell.debug/files/smoke emulator-shots/ || true
            adb logcat -d -v time > emulator-shots/logcat.txt || true

      - name: Collect test results
        if: always()
        run: |
          mkdir -p emulator-shots
          if [ -d app/build/outputs/connected_android_test_additional_output ]; then
            find app/build/outputs/connected_android_test_additional_output -name '*.png' -exec cp -n {} emulator-shots/ \;
          fi
          find app/build/outputs/androidTest-results -name '*.xml' -exec cp {} emulator-shots/ \; 2>/dev/null || true
          ls -la emulator-shots
          # On a failure, print what was on screen (the test logs the semantics tree) so the job log shows it.
          if [ -f smoke-failed ] && [ -f emulator-shots/logcat.txt ]; then
            grep -E "/(SmokeTest|TestRunner|AndroidRuntime)\(" emulator-shots/logcat.txt | tail -n 400 || true
          fi

      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-test
          path: emulator-shots/
          retention-days: 14

      # Pull request runs push too (to shots/emulator-<number>-merge), so a
      # failure there can be seen. A fork's read-only token can't push, which is fine.
      - name: Push emulator screenshots
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/push-screenshots.sh emulator-shots emulator

      - name: Fail if the smoke test failed
        run: test ! -f smoke-failed
